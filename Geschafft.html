<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geschafft</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/geschafft.js"></script>
  <img src="\Logo_HSFL.png" alt="HSFL Logo" class="logo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round:ital@0;1&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <h1>HSFL Quizseite</h1>
  </header>
  <main>
    <div class="success-box">
      <h2>Alle Fragen richtig!</h2>
      <p id="attempt-text"></p>
    </div>
    <p>Sei doch so nett und gib uns ein kleines Feedback wie du das Quiz fandest!</p>
        <div class="star-rating">
         <span class="star" data-value="1">&#9733;</span>
         <span class="star" data-value="2">&#9733;</span>
         <span class="star" data-value="3">&#9733;</span>
         <span class="star" data-value="4">&#9733;</span>
         <span class="star" data-value="5">&#9733;</span>
        </div>
        <div class="question">
            <p>Hast du noch Anmerkungen, oder verbesserungsvorschläge?</p>
            <input type="text" id="q6a" name="question6">
            </div>
    <div class="info-box">
      <p>Falls dir das Exponat und das Modul gefallen haben, kannst du hier mehr erfahren: <span id="info-link"></span></p>
      <p>Hier ist deine digitale Belohnung: <span id="reward-link"></span></p>
      <img id="reward-image" alt="Belohnung" style="display:none;">
    </div>
  </main>
</body>
</html>
